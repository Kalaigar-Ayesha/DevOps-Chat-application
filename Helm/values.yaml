global:
  environment: dev

backend:
  image: kayesha01/chat-app-backend
  tag: latest
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

frontend:
  image: kayesha01/chat-app-frontend
  tag: latest
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

mongo:
  image: mongo
  tag: "7"
  storage: 5Gi
  haMode: "replicaset"
  replicas: 3

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  cpuUtilization: 50

service:
  backendPort: 5000
  frontendPort: 80
  mongoPort: 27017

secrets:
  mongodbUri: mongodb://chat-app-chat-app-mongo:27017/chat-app
  jwtSecret: supersecret
  clientUrl: http://chatapp-prod.local

ingress:
  host: chatapp-prod.local
  tls: true
  tlsSecretName: chatapp-tls-cert

certManager:
  enabled: true
  email: admin@chatapp-prod.local

externalSecrets:
  enabled: false
  awsRegion: us-east-1
  serviceAccountName: external-secrets-sa
  remoteSecretKey: /production/chatapp/backend